name: Preview smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: controlled-preview-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: preview
    env:
      APP_ENV: preview
      PREVIEW_CONFIRM: NEXO_PREVIEW
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      REDIS_URL: ${{ secrets.REDIS_URL }}
      AUTH_JWT_PRIVATE_KEY: ${{ secrets.AUTH_JWT_PRIVATE_KEY }}
      AUTH_JWT_PUBLIC_KEY: ${{ secrets.AUTH_JWT_PUBLIC_KEY }}
      WEB_ORIGIN: ${{ vars.WEB_ORIGIN }}
      NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.13.1, run_install: false }
      - uses: actions/setup-node@v4
        with: { node-version-file: .node-version, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm env:validate
      - run: pnpm prisma:generate
      - run: pnpm prisma:migrate
      - run: pnpm preview:smoke
