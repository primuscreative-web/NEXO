packages:
  - apps/*
  - packages/*
  - packages/contexts/*

overrides:
  '@hono/node-server': 2.0.10
  'test-exclude>glob': 11.1.0
  find-my-way: 9.7.0
  postcss: 8.5.24
  sharp: 0.35.3
  valibot: 1.4.2

allowBuilds:
  '@prisma/engines': true
  '@scarf/scarf': false
  '@swc/core': true
  argon2: true
  esbuild: true
  msgpackr-extract: false
  prisma: true
  sharp: true

catalog:
  '@nestjs/common': 11.1.28
  '@nestjs/core': 11.1.28
  '@nestjs/platform-fastify': 11.1.28
  '@opentelemetry/api': 1.9.1
  '@types/node': 26.1.2
  pino: 10.3.1
  reflect-metadata: 0.2.2
  rxjs: 7.8.2
  tsx: 4.23.5
  tsup: 8.5.1
  typescript: 7.0.2
  vitest: 4.1.10
  zod: 4.4.3

minimumReleaseAgeExclude:
  - '@fastify/cookie@11.1.2'
  - '@hono/node-server@2.0.10'
  - fast-uri@3.1.4 || 4.1.1
  - sharp@0.35.0
  - postcss@8.5.12 || 8.5.18 || 8.5.24
  - find-my-way@9.6.1
  - valibot@1.4.2
