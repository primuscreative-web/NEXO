packages:
  - apps/*
  - packages/*
  - packages/contexts/*

overrides:
  '@hono/node-server': 1.19.13
  postcss: 8.5.10

allowBuilds:
  '@prisma/engines': true
  '@scarf/scarf': false
  '@swc/core': true
  argon2: true
  esbuild: true
  prisma: true
  sharp: true

catalog:
  '@nestjs/common': 11.1.28
  '@nestjs/core': 11.1.28
  '@nestjs/platform-fastify': 11.1.28
  '@opentelemetry/api': 1.9.0
  '@types/node': 24.9.1
  pino: 10.1.0
  reflect-metadata: 0.2.2
  rxjs: 7.8.2
  tsx: 4.20.6
  tsup: 8.5.0
  typescript: 5.9.3
  vitest: 3.2.6
  zod: 4.1.12

minimumReleaseAgeExclude:
  - '@fastify/cookie@11.1.2'
